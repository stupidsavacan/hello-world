name: Run LoopDeck restore bootstrap

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore:
    if: github.head_ref == 'loopdeck-ii/v62-r2-complete-zip-restore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: loopdeck-ii/v62-r2-complete-zip-restore
          fetch-depth: 0
      - name: Materialize every available supplied-ZIP blob
        shell: bash
        run: |
          set -euo pipefail
          awk '
            /cat > \/tmp\/zip-manifest.txt <<'\''EOF_MANIFEST'\''/ { inside=1; next }
            inside && /EOF_MANIFEST/ { exit }
            inside { sub(/^          /, ""); print }
          ' .github/workflows/loopdeck-full-restore-bootstrap.yml > /tmp/zip-manifest.txt

          : > loopdeck/.zip-restore-skipped.txt
          restored=0
          while read -r expected path; do
            case "$path" in
              package.json|tests/nativeSaveResult.test.ts)
                echo "integration-skip $path expected=$expected" >> loopdeck/.zip-restore-skipped.txt
                continue
                ;;
            esac
            if git cat-file -e "${expected}^{blob}" 2>/dev/null; then
              mkdir -p "loopdeck/$(dirname "$path")"
              git cat-file blob "$expected" > "loopdeck/$path"
              actual=$(git hash-object "loopdeck/$path")
              test "$actual" = "$expected"
              restored=$((restored + 1))
            else
              echo "object-missing $path expected=$expected" >> loopdeck/.zip-restore-skipped.txt
            fi
          done < /tmp/zip-manifest.txt

          echo "Restored $restored exact supplied-ZIP blobs from repository object history"
          rm -f .github/workflows/loopdeck-full-restore-bootstrap.yml .github/workflows/loopdeck-restore-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- loopdeck .github/workflows/loopdeck-full-restore-bootstrap.yml .github/workflows/loopdeck-restore-runner.yml
          if git diff --cached --quiet; then
            echo "No restoration changes generated"
            exit 0
          fi
          git commit -m "[loopdeck II] Materialize ZIP blobs from repository history"
          git push origin HEAD:loopdeck-ii/v62-r2-complete-zip-restore
