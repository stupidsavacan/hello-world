name: Mahjong Active Policy Bootstrap

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'guard/mahjong-active-v5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const required = 'Retirement Guard / retirement-policy';
            const digest = 'f72699a846a905d4e5062623bb231ea5c2d235b9cf48c71bc393f7b6abf06115';

            let sawFailure = false;
            for (let i = 0; i < 30; i += 1) {
              const res = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
              if (res.data.some((s) => s.context === required && s.state === 'failure')) { sawFailure = true; break; }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!sawFailure) { core.setFailed('Ordinary guard failure not observed.'); return; }

            const readText = async (path) => {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref: pr.head.sha });
              if (Array.isArray(res.data) || !res.data.content) throw new Error(`Missing ${path}`);
              return Buffer.from(res.data.content, 'base64').toString('utf8');
            };

            const registry = JSON.parse(await readText('.retirement/retired-paths.json'));
            const critical = {
              guardPaths: [...(registry.guardPaths || [])].sort(),
              requiredCheckContext: registry.requiredCheckContext || '',
              retiredContractMarkers: [...(registry.retiredContractMarkers || [])].sort(),
              retiredModuleRoots: [...(registry.retiredModuleRoots || [])].sort(),
              retiredPaths: [...(registry.retiredPaths || [])].sort(),
            };
            const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if (registry.policyDigest !== digest || actualDigest !== digest) {
              core.setFailed(`Mahjong active policy digest mismatch: ${actualDigest}`); return;
            }

            const policy = [
              '.retirement/retired-paths.json',
              '.github/workflows/retirement-guard.yml',
              'loopdeck/tests/retirementSentry.test.mjs',
              'mahjong/tests/retirement-sentry.test.js',
            ];
            const runtime = [
              'ActionResolver.js','AssistManager.js','CallResolver.js','CallWindow.js','CpuStrategy.js','CpuVisibleTiles.js',
              'DoraCalculator.js','FuritenManager.js','GameRecord.js','InvariantChecker.js','RecoveryManager.js','RuleConfig.js',
              'TileLedger.js','GameEngine.js',
            ].map((f) => `mahjong/src/game/${f}`);
            const expected = new Set([...policy, ...runtime]);
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const actual = new Map(files.map((f) => [f.filename, f.status]));
            const unexpected = [...actual.keys()].filter((f) => !expected.has(f));
            const missing = [...expected].filter((f) => !actual.has(f));
            const wrongPolicy = policy.filter((f) => actual.get(f) !== 'modified');
            const wrongRuntime = runtime.filter((f) => actual.get(f) !== 'added');
            if (unexpected.length || missing.length || wrongPolicy.length || wrongRuntime.length) {
              core.setFailed(`Migration file set mismatch: ${JSON.stringify({ unexpected, missing, wrongPolicy, wrongRuntime })}`); return;
            }

            for (const path of policy.slice(1)) {
              if (!(await readText(path)).includes(digest)) { core.setFailed(`${path} does not pin migration digest`); return; }
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state: 'success', context: required,
              description: 'Authorized one-time active Mahjong policy migration'
            });
