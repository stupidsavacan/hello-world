name: Cross Retirement Policy

on:
  pull_request:
    paths:
      - 'loopdeck/**'
      - 'mahjong/**'
      - '.github/workflows/cross-retirement-policy.yml'
  push:
    branches: [main]
    paths:
      - 'loopdeck/**'
      - 'mahjong/**'
      - '.github/workflows/cross-retirement-policy.yml'

jobs:
  loopdeck-watches-mahjong:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loopdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired Mahjong paths remain retired
        run: node tests/mahjongRetirementPolicy.test.mjs

  mahjong-watches-loopdeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify retired LoopDeck paths remain retired
        run: node mahjong/tests/loopdeck-retirement-policy.test.js
