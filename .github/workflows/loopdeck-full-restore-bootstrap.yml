EOF_MANIFEST
          : > loopdeck/.zip-restore-skipped.txt
          while read -r expected path; do
            case "$path" in
              package.json|tests/nativeSaveResult.test.ts)
                echo "integration-skip $path expected=$expected" >> loopdeck/.zip-restore-skipped.txt
                continue
                ;;
            esac
            src="/tmp/loopdeck-canonical/$path"
            if [ ! -f "$src" ]; then
              echo "canonical-missing $path expected=$expected" >> loopdeck/.zip-restore-skipped.txt
              continue
            fi
            actual=$(git hash-object "$src")
            if [ "$actual" != "$expected" ]; then
              echo "canonical-diff $path expected=$expected actual=$actual" >> loopdeck/.zip-restore-skipped.txt
              continue
            fi
            mkdir -p "loopdeck/$(dirname "$path")"
            cp "$src" "loopdeck/$path"
          done < /tmp/zip-manifest.txt

          rm -f .github/workflows/loopdeck-full-restore-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- loopdeck .github/workflows/loopdeck-full-restore-bootstrap.yml
          if git diff --cached --quiet; then
            echo "No restoration changes generated"
            exit 0
          fi
          git commit -m "[loopdeck II] Materialize canonical ZIP-matching assets"
          git push origin HEAD:loopdeck-ii/v62-r2-complete-zip-restore
