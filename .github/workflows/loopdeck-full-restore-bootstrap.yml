name: LoopDeck full restore bootstrap

on:
  push:
    branches:
      - loopdeck-ii/v62-r2-complete-zip-restore

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore archive-matching LoopDeck files
        shell: bash
        run: |
          set -euo pipefail
          CANON_SHA=a45d9cb1750d36c83c1f23d50c5597aef5dc5b09
          curl -L --fail --retry 3 "https://github.com/stupidsavacan/LoopDeck/archive/${CANON_SHA}.tar.gz" -o /tmp/loopdeck-canonical.tar.gz
          rm -rf /tmp/loopdeck-canonical
          mkdir -p /tmp/loopdeck-canonical
          tar -xzf /tmp/loopdeck-canonical.tar.gz -C /tmp/loopdeck-canonical --strip-components=1
