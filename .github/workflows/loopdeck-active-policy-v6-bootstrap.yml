name: Guard v6 Exact Atomic Bootstrap

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize-v6-atomic:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'guard/retirement-monotonic-v6-atomic'
    runs-on: ubuntu-latest
    steps:
      - name: Validate exact monotonic v6 migration
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const required = 'Retirement Guard / retirement-policy';
            const digest = '71193fd4fd219e37e2c05147f2333d552f4f414a6037567daba1061d817b6a16';

            let sawFailure = false;
            for (let i = 0; i < 30; i += 1) {
              const res = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
              if (res.data.some((s) => s.context === required && s.state === 'failure')) { sawFailure = true; break; }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!sawFailure) { core.setFailed('Ordinary v5 Guard failure not observed.'); return; }

            async function readText(path) {
              const res = await github.rest.repos.getContent({ owner, repo, path, ref: pr.head.sha });
              if (Array.isArray(res.data) || !('content' in res.data)) throw new Error(`Missing ${path}`);
              return Buffer.from(res.data.content || '', 'base64').toString('utf8');
            }

            const policyFiles = [
              '.retirement/retired-paths.json',
              '.retirement/retirement-ledger.jsonl',
              '.github/workflows/retirement-guard.yml',
              'loopdeck/tests/retirementSentry.test.mjs',
              'mahjong/tests/retirement-sentry.test.js',
            ];
            const runtime = [
              'ActionResolver.js','AssistManager.js','CallResolver.js','CallWindow.js','CpuStrategy.js','CpuVisibleTiles.js',
              'DoraCalculator.js','FuritenManager.js','GameEngine.js','GameEngine.part1.js','GameEngine.part2.js','GameEngine.part3.js',
              'GameRecord.js','InvariantChecker.js','RecoveryManager.js','RuleConfig.js','TileLedger.js',
            ].map((f) => `mahjong/src/game/${f}`);
            const expected = new Set([...policyFiles, ...runtime]);
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number, per_page: 100 });
            const actual = new Map(files.map((f) => [f.filename, f.status]));
            const unexpected = [...actual.keys()].filter((f) => !expected.has(f));
            const missing = [...expected].filter((f) => !actual.has(f));
            const wrongRuntime = runtime.filter((f) => actual.get(f) !== 'removed');
            const wrongPolicy = policyFiles.filter((f) => actual.get(f) !== (f.endsWith('retirement-ledger.jsonl') ? 'added' : 'modified'));
            if (actual.size !== 22 || unexpected.length || missing.length || wrongRuntime.length || wrongPolicy.length) {
              core.setFailed(`Exact v6 file set mismatch: ${JSON.stringify({ size: actual.size, unexpected, missing, wrongRuntime, wrongPolicy })}`);
              return;
            }

            const anchor = JSON.parse(await readText('.retirement/retired-paths.json'));
            const critical = {
              guardPaths: [...(anchor.guardPaths || [])].sort(),
              ledgerPath: anchor.ledgerPath || '',
              policyVersion: anchor.policyVersion || 0,
              requiredCheckContext: anchor.requiredCheckContext || '',
              retiredContractMarkers: [...(anchor.retiredContractMarkers || [])].sort(),
              retiredModuleRoots: [...(anchor.retiredModuleRoots || [])].sort(),
              retiredPaths: [...(anchor.retiredPaths || [])].sort(),
              workflowPolicy: anchor.workflowPolicy || '',
            };
            const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if (anchor.policyDigest !== digest || actualDigest !== digest) {
              core.setFailed(`v6 anchor digest mismatch: declared=${anchor.policyDigest || 'missing'} actual=${actualDigest}`);
              return;
            }
            if (anchor.policyVersion !== 6 || anchor.ledgerPath !== '.retirement/retirement-ledger.jsonl' || anchor.workflowPolicy !== 'non-guard-workflows-delete-only') {
              core.setFailed('v6 anchor is not the approved monotonic shape.');
              return;
            }
            if ((await readText('.retirement/retirement-ledger.jsonl')).trim() !== '') {
              core.setFailed('Initial v6 ledger must be empty.'); return;
            }

            for (const path of policyFiles.filter((p) => !p.endsWith('retirement-ledger.jsonl'))) {
              if (!(await readText(path)).includes(digest)) {
                core.setFailed(`${path} does not pin the approved v6 digest.`); return;
              }
            }
            const guard = await readText('.github/workflows/retirement-guard.yml');
            for (const invariant of ['startsWith(baseLedger)', 'non-guard-workflows-delete-only', 'retirement-ledger.jsonl', 'workflow-policy:']) {
              if (!guard.includes(invariant)) { core.setFailed(`v6 Guard missing invariant ${invariant}`); return; }
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, state: 'success', context: required,
              description: 'Authorized exact 22-file monotonic Guard v6 migration'
            });
            core.notice('Authorized exact 17-removal + 5-policy v6 migration only.');
