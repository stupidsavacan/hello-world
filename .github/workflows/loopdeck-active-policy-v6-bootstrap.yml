name: LoopDeck Active Policy v6 Bootstrap

on:
  workflow_run:
    workflows: ["Retirement Guard"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize-active-policy-migration:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.head_branch == 'agent/active-products-policy-v6-0157' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Validate the one active-product policy migration
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const allowedBranch = 'agent/active-products-policy-v6-0157';
            const allowedDigest = '994a0a34cc2cb292d6c94c8da64a77b70f0190feae8be02e4480d4b84a042b10';
            const requiredContext = 'Retirement Guard / retirement-policy';
            const policyFiles = [
              '.retirement/retired-paths.json',
              '.github/workflows/retirement-guard.yml',
              'loopdeck/tests/retirementSentry.test.mjs',
              'mahjong/tests/retirement-sentry.test.js',
            ];

            if (run.head_branch !== allowedBranch || !run.head_sha) {
              core.setFailed('Active-policy bootstrap branch/head mismatch.');
              return;
            }
            const prs = run.pull_requests || [];
            if (prs.length !== 1) {
              core.setFailed(`Expected exactly one PR, found ${prs.length}.`);
              return;
            }
            const prNumber = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.ref !== allowedBranch || pr.head.sha !== run.head_sha) {
              core.setFailed('Active-policy PR no longer matches its workflow run.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: prNumber, per_page: 100,
            });
            const actual = new Map(files.map((file) => [file.filename, file.status]));
            const unexpected = [...actual.keys()].filter((path) => !policyFiles.includes(path));
            const missing = policyFiles.filter((path) => !actual.has(path));
            const wrongStatus = policyFiles.filter((path) => actual.get(path) !== 'modified');
            if (unexpected.length || missing.length || wrongStatus.length || actual.size !== policyFiles.length) {
              core.setFailed(`Policy migration file set mismatch. unexpected=${unexpected.join(',')} missing=${missing.join(',')} wrongStatus=${wrongStatus.join(',')}`);
              return;
            }

            async function getText(path) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref: run.head_sha });
              if (Array.isArray(response.data) || !response.data.content) throw new Error(`Missing ${path}`);
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            const registry = JSON.parse(await getText('.retirement/retired-paths.json'));
            const critical = {
              guardPaths: [...(registry.guardPaths || [])].sort(),
              requiredCheckContext: registry.requiredCheckContext || '',
              retiredContractMarkers: [...(registry.retiredContractMarkers || [])].sort(),
              retiredModuleRoots: [...(registry.retiredModuleRoots || [])].sort(),
              retiredPaths: [...(registry.retiredPaths || [])].sort(),
            };
            const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if (registry.policyDigest !== allowedDigest || actualDigest !== allowedDigest) {
              core.setFailed(`Active policy digest mismatch. declared=${registry.policyDigest || 'missing'} actual=${actualDigest}`);
              return;
            }
            if ((registry.retiredPaths || []).length || (registry.retiredModuleRoots || []).length || (registry.retiredContractMarkers || []).length) {
              core.setFailed('Active-product migration must not retire LoopDeck or Mahjong contracts.');
              return;
            }
            for (const path of policyFiles.slice(1)) {
              const text = await getText(path);
              if (!text.includes(allowedDigest)) {
                core.setFailed(`${path} does not pin the approved active-product digest.`);
                return;
              }
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: run.head_sha, state: 'success', context: requiredContext,
              description: 'One-time active-product policy migration authorized'
            });
            core.notice(`Authorized active-product policy migration PR #${prNumber}.`);
