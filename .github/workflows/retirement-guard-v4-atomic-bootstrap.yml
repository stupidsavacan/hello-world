name: Retirement Guard v4 Atomic Bootstrap

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize-atomic-v4-policy:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'guard/retirement-policy-v4-atomic'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the ordinary guard, then validate the one atomic v4 upgrade
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const allowedBranch = 'guard/retirement-policy-v4-atomic';
            const allowedDigest = '37243f8838a016c7a53d5e4605b946f3c75b571854cbe5ce5c5b25da54baa76f';
            const requiredContext = 'Retirement Guard / retirement-policy';

            if (pr.state !== 'open' || pr.base.ref !== 'main' || pr.head.ref !== allowedBranch || !pr.head.sha) {
              core.setFailed('Atomic bootstrap PR identity mismatch.');
              return;
            }

            // The ordinary base-owned Retirement Guard writes this context pending -> failure.
            // Wait until that failure is observable before doing anything, so our one-time
            // success cannot race and then be overwritten by the ordinary guard afterward.
            let sawOrdinaryFailure = false;
            for (let attempt = 0; attempt < 24; attempt += 1) {
              const response = await github.rest.repos.listCommitStatusesForRef({
                owner,
                repo,
                ref: pr.head.sha,
                per_page: 100,
              });
              const status = response.data.find((item) => item.context === requiredContext);
              if (status?.state === 'failure') {
                sawOrdinaryFailure = true;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 3000));
            }
            if (!sawOrdinaryFailure) {
              core.setFailed('Ordinary Retirement Guard failure was not observed; refusing bootstrap authorization.');
              return;
            }

            const policyFiles = [
              '.retirement/retired-paths.json',
              '.github/workflows/retirement-guard.yml',
              'loopdeck/tests/retirementSentry.test.mjs',
              'mahjong/tests/retirement-sentry.test.js',
            ];

            async function getText(path, ref) {
              const response = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(response.data) || !response.data.content) throw new Error(`Missing file content for ${path}`);
              return Buffer.from(response.data.content, 'base64').toString('utf8');
            }

            const registryText = await getText('.retirement/retired-paths.json', pr.head.sha);
            const registry = JSON.parse(registryText);
            const critical = {
              guardPaths: [...(registry.guardPaths || [])].sort(),
              requiredCheckContext: registry.requiredCheckContext || '',
              retiredContractMarkers: [...(registry.retiredContractMarkers || [])].sort(),
              retiredModuleRoots: [...(registry.retiredModuleRoots || [])].sort(),
              retiredPaths: [...(registry.retiredPaths || [])].sort(),
            };
            const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if (registry.policyDigest !== allowedDigest || actualDigest !== allowedDigest) {
              core.setFailed(`Atomic policy digest mismatch. declared=${registry.policyDigest || 'missing'} actual=${actualDigest}`);
              return;
            }

            for (const path of policyFiles.slice(1)) {
              const text = await getText(path, pr.head.sha);
              if (!text.includes(allowedDigest)) {
                core.setFailed(`${path} does not pin the approved v4 digest.`);
                return;
              }
            }

            // Derive the permitted deletion set from THIS PR's base. Any retired exact path
            // that exists on base must be removed in the atomic PR; already-absent paths need
            // no fake diff. Nothing outside those removals + four policy files may change.
            const baseRetiredFiles = [];
            for (const path of registry.retiredPaths || []) {
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: pr.base.sha });
                if (!Array.isArray(response.data)) baseRetiredFiles.push(path);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const expected = new Set([...policyFiles, ...baseRetiredFiles]);
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const actual = new Map(files.map((file) => [file.filename, file.status]));
            const unexpected = [...actual.keys()].filter((path) => !expected.has(path));
            const missing = [...expected].filter((path) => !actual.has(path));
            const wrongRemovalStatus = baseRetiredFiles.filter((path) => actual.get(path) !== 'removed');
            const wrongPolicyStatus = policyFiles.filter((path) => actual.get(path) !== 'modified');

            if (unexpected.length || missing.length || wrongRemovalStatus.length || wrongPolicyStatus.length || actual.size !== expected.size) {
              core.setFailed(
                `Atomic v4 file set mismatch. expectedRemovals=${baseRetiredFiles.length} ` +
                `unexpected=${unexpected.join(',')} missing=${missing.join(',')} ` +
                `wrongRemovals=${wrongRemovalStatus.join(',')} wrongPolicy=${wrongPolicyStatus.join(',')}`
              );
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: pr.head.sha,
              state: 'success',
              context: requiredContext,
              description: `Atomic Guard v4 authorized (${baseRetiredFiles.length} retired paths removed)`
            });
            core.notice(`Authorized atomic Guard v4 PR #${pr.number}; all base-present retired paths are removed and the approved digest is pinned.`);
