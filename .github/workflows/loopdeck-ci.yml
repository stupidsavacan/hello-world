name: LoopDeck CI

on:
  pull_request:
    paths:
      - 'loopdeck/**'
      - '.github/workflows/loopdeck-ci.yml'
  push:
    branches: [main]
    paths:
      - 'loopdeck/**'
      - '.github/workflows/loopdeck-ci.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: loopdeck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: loopdeck/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
