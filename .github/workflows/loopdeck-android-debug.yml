name: LoopDeck Android Debug APK

on:
  pull_request:
    paths:
      - 'loopdeck/**'
      - '.github/workflows/loopdeck-android-debug.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: loopdeck-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm
          cache-dependency-path: loopdeck/package.json

      - name: Install web dependencies
        working-directory: loopdeck
        run: npm install --include=dev

      - name: Test web app
        working-directory: loopdeck
        run: npm test

      - name: Build web assets
        working-directory: loopdeck
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        working-directory: loopdeck/android
        run: gradle --no-daemon assembleDebug

      - name: Collect debug APK
        run: |
          set -euo pipefail
          rm -rf artifacts/loopdeck-debug-apk
          mkdir -p artifacts/loopdeck-debug-apk
          find loopdeck/android/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/loopdeck-debug-apk/ \;
          apk_count="$(find artifacts/loopdeck-debug-apk -type f -name "*.apk" | wc -l | tr -d ' ')"
          if [ "$apk_count" -eq 0 ]; then
            echo "::error::No debug APK was produced."
            exit 1
          fi
          find artifacts/loopdeck-debug-apk -type f -name "*.apk" -print

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopDeck-debug-apk
          path: artifacts/loopdeck-debug-apk/*.apk
          if-no-files-found: error
          retention-days: 1
