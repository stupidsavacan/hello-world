name: Retirement Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  retirement-policy:
    if: github.event_name == 'pull_request_target'
    name: retirement-policy
    runs-on: ubuntu-latest
    steps:
      - id: guard
        uses: actions/github-script@v7
        with:
          script: |
            const crypto=require('crypto'), posix=require('path').posix;
            const {owner,repo}=context.repo, pr=context.payload.pull_request;
            const EXPECTED='f72699a846a905d4e5062623bb231ea5c2d235b9cf48c71bc393f7b6abf06115', required='Retirement Guard / retirement-policy';
            await github.rest.repos.createCommitStatus({owner,repo,sha:pr.head.sha,state:'pending',context:required,description:'Trusted retirement policy is running'});
            const response=await github.rest.repos.getContent({owner,repo,path:'.retirement/retired-paths.json',ref:pr.base.sha});
            const registry=JSON.parse(Buffer.from(response.data.content,'base64').toString('utf8'));
            const critical={guardPaths:[...(registry.guardPaths||[])].sort(),requiredCheckContext:registry.requiredCheckContext||'',retiredContractMarkers:[...(registry.retiredContractMarkers||[])].sort(),retiredModuleRoots:[...(registry.retiredModuleRoots||[])].sort(),retiredPaths:[...(registry.retiredPaths||[])].sort()};
            const actual=crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if(registry.policyDigest!==EXPECTED||actual!==EXPECTED){core.setFailed('Base retirement policy drifted.');return;}
            const canonical=input=>{let v=posix.normalize(String(input||'')).replace(/^\.\//,'');v=v.replace(/\.(?:[cm]?[jt]sx?|css|json)$/i,'').replace(/\/index$/i,'');return v};
            const retiredPaths=new Set(registry.retiredPaths||[]), roots=(registry.retiredModuleRoots||[]).map(canonical), markers=registry.retiredContractMarkers||[], guards=new Set(registry.guardPaths||[]);
            const matches=input=>{const c=canonical(input);return roots.some(r=>c===r||c.startsWith(r+'/'))};
            const files=await github.paginate(github.rest.pulls.listFiles,{owner,repo,pull_number:pr.number,per_page:100});
            const violations=[];
            for(const file of files){
              if(file.status!=='removed'&&(retiredPaths.has(file.filename)||matches(file.filename)))violations.push(file.filename);
              if(guards.has(file.filename))violations.push('guard:'+file.filename);
              if(file.status==='removed'||!file.sha||!/\.(?:[cm]?[jt]sx?)$/i.test(file.filename))continue;
              const blob=await github.rest.git.getBlob({owner,repo,file_sha:file.sha});const source=Buffer.from(blob.data.content,'base64').toString('utf8');
              for(const marker of markers)if(source.includes(marker))violations.push(file.filename+' -> '+marker);
            }
            if(violations.length){core.setFailed('Retirement contract violated: '+[...new Set(violations)].join(' | '));return;}
            core.info('Retirement contract clean.');
      - if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const pr=context.payload.pull_request, outcome='${{ steps.guard.outcome }}';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:pr.head.sha,state:outcome==='success'?'success':'failure',context:'Retirement Guard / retirement-policy',description:outcome==='success'?'Retirement policy passed':'Retirement policy rejected this pull request'});

  current-tree:
    if: github.event_name == 'push'
    name: current-tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Verify current tree
        run: |
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cp=require('child_process'),posix=require('path').posix;
          const EXPECTED='f72699a846a905d4e5062623bb231ea5c2d235b9cf48c71bc393f7b6abf06115',r=JSON.parse(fs.readFileSync('.retirement/retired-paths.json','utf8'));
          const critical={guardPaths:[...(r.guardPaths||[])].sort(),requiredCheckContext:r.requiredCheckContext||'',retiredContractMarkers:[...(r.retiredContractMarkers||[])].sort(),retiredModuleRoots:[...(r.retiredModuleRoots||[])].sort(),retiredPaths:[...(r.retiredPaths||[])].sort()};
          const actual=crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');if(r.policyDigest!==EXPECTED||actual!==EXPECTED)process.exit(1);
          const files=cp.execSync('git ls-files -z').toString().split('\0').filter(Boolean),set=new Set(files);const canonical=input=>{let v=posix.normalize(String(input||'')).replace(/^\.\//,'');return v.replace(/\.(?:[cm]?[jt]sx?|css|json)$/i,'').replace(/\/index$/i,'')};const roots=(r.retiredModuleRoots||[]).map(canonical);const bad=files.filter(f=>(r.retiredPaths||[]).includes(f)||roots.some(x=>canonical(f)===x||canonical(f).startsWith(x+'/')));const missing=(r.guardPaths||[]).filter(f=>!set.has(f));if(bad.length||missing.length){console.error({bad,missing});process.exit(1)}
          NODE
      - run: node loopdeck/tests/retirementSentry.test.mjs
      - run: node mahjong/tests/retirement-sentry.test.js
