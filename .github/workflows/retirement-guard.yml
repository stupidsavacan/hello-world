name: Retirement Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  retirement-policy:
    name: retirement-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const os = require('node:os');
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const embedded = {"crypto.mjs":"","canonical.mjs":"","protocol.mjs":"","guard-policy.mjs":"","github-adapter.mjs":""};
            const moduleDir = fs.mkdtempSync(path.join(os.tmpdir(), 'crown-v61-'));
            for (const [name, value] of Object.entries(embedded)) fs.writeFileSync(path.join(moduleDir, name), Buffer.from(value, 'base64'), { mode: 0o600 });
            const adapter = await import(`${pathToFileURL(path.join(moduleDir, 'github-adapter.mjs')).href}?run=${Date.now()}`);
            const { owner, repo } = context.repo;
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              const required = 'Retirement Guard / retirement-policy';
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state: 'pending', context: required,
                description: 'V6.1 Crown and retirement policy is running',
              });
              try {
                const result = await adapter.evaluatePullRequest({
                  github, owner, repo, pr,
                  expectedAnchorDigest: '5186bc43c64d728f339b36de23c04a721002b56a7dc5e674133690da857f5b6d',
                });
                core.info('V6.1 policy passed: ' + JSON.stringify(result));
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.head.sha, state: 'success', context: required,
                  description: 'V6.1 Crown and retirement policy passed',
                });
              } catch (error) {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.head.sha, state: 'failure', context: required,
                  description: 'V6.1 Crown and retirement policy rejected this PR',
                });
                core.setFailed(error instanceof Error ? error.message : String(error));
              }
            } else if (context.eventName === 'push') {
              const result = await adapter.evaluatePush({
                github, owner, repo, sha: context.sha,
                expectedAnchorDigest: '5186bc43c64d728f339b36de23c04a721002b56a7dc5e674133690da857f5b6d',
              });
              core.info('V6.1 current tree clean: ' + JSON.stringify(result));
            } else {
              throw new Error('unsupported event: ' + context.eventName);
            }
