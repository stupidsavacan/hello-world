name: Retirement Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  retirement-policy:
    name: retirement-policy
    runs-on: ubuntu-latest
    steps:
      - name: Prepare pinned policy evaluator
        shell: bash
        env:
          CROWN_V62_VERIFIER_KEY_B64: ${{ secrets.CROWN_V62_VERIFIER_KEY_B64 }}
        run: |
          set -euo pipefail
          module_dir="$RUNNER_TEMP/crown-v62-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 700 "$module_dir"
          sealed_path="$module_dir/evaluator.sealed.b64"
          : > "$sealed_path"
          printf '%s' '' >> "$sealed_path"
          printf '%s' '' >> "$sealed_path"
          printf '%s' '' >> "$sealed_path"
          printf '%s' '' >> "$sealed_path"
          printf '%s' '' >> "$sealed_path"
          node --input-type=module <<'CROWN_DECRYPT'
          import { createDecipheriv, createHash } from 'node:crypto';
          import { chmodSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = process.env.RUNNER_TEMP + '/crown-v62-' + process.env.GITHUB_RUN_ID + '-' + process.env.GITHUB_RUN_ATTEMPT;
          const keyText = process.env.CROWN_V62_VERIFIER_KEY_B64 ?? '';
          const key = Buffer.from(keyText, 'base64');
          if (key.length !== 32 || key.toString('base64') !== keyText) throw new Error('policy evaluator key unavailable');
          const sealed = Buffer.from(readFileSync(join(dir, 'evaluator.sealed.b64'), 'utf8'), 'base64');
          if (sealed.length < 29) throw new Error('invalid policy evaluator envelope');
          const iv = sealed.subarray(0, 12); const tag = sealed.subarray(12, 28); const ciphertext = sealed.subarray(28);
          const aad = Buffer.from("CROWN-V6.2/POLICY-EVALUATOR/v1\nanchor=0a7f24ba1a7a9b449241e139b223e4540270437f521594ff5bd6c0ddf74ba6f8\n", 'utf8');
          const decipher = createDecipheriv('aes-256-gcm', key, iv); decipher.setAAD(aad); decipher.setAuthTag(tag);
          const plain = Buffer.concat([decipher.update(ciphertext), decipher.final()]);
          if (createHash('sha256').update(plain).digest('hex') !== '891110e5d1310d552c47335a3306339de0783aee21fb63d26c5bcb8a4ee55e40') throw new Error('policy evaluator digest mismatch');
          const payload = JSON.parse(plain.toString('utf8'));
          if (payload.version !== 1 || payload.entry !== 'github-adapter-v62.mjs' || !payload.modules) throw new Error('invalid policy evaluator payload');
          for (const [name, source] of Object.entries(payload.modules)) {
            if (!/^[A-Za-z0-9.-]+$/.test(name) || typeof source !== 'string') throw new Error('invalid policy evaluator module');
            const target = join(dir, name); writeFileSync(target, source, { mode: 0o600 }); chmodSync(target, 0o600);
          }
          CROWN_DECRYPT
          rm -f "$sealed_path"
          echo "CROWN_V62_MODULE_DIR=$module_dir" >> "$GITHUB_ENV"
      - uses: actions/github-script@v7
        with:
          script: |
            const path = require('node:path');
            const { pathToFileURL } = require('node:url');
            const moduleDir = process.env.CROWN_V62_MODULE_DIR;
            if (!moduleDir) throw new Error('missing prepared policy evaluator directory');
            const adapter = await import(`${pathToFileURL(path.join(moduleDir, 'github-adapter-v62.mjs')).href}?run=${Date.now()}`);
            const { owner, repo } = context.repo;
            const required = 'Retirement Guard / retirement-policy';
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state: 'pending', context: required,
                description: 'V6.2 Crown and retirement policy is running',
              });
              try {
                const result = await adapter.evaluatePullRequest({
                  github, owner, repo, pr,
                  expectedAnchorDigest: '0a7f24ba1a7a9b449241e139b223e4540270437f521594ff5bd6c0ddf74ba6f8',
                });
                core.info('V6.2 policy passed: ' + JSON.stringify(result));
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.head.sha, state: 'success', context: required,
                  description: 'V6.2 Crown and retirement policy passed',
                });
              } catch (error) {
                await github.rest.repos.createCommitStatus({
                  owner, repo, sha: pr.head.sha, state: 'failure', context: required,
                  description: 'V6.2 Crown and retirement policy rejected this PR',
                });
                core.setFailed(error instanceof Error ? error.message : String(error));
              }
            } else if (context.eventName === 'push') {
              const result = await adapter.evaluatePush({
                github, owner, repo, sha: context.sha,
                expectedAnchorDigest: '0a7f24ba1a7a9b449241e139b223e4540270437f521594ff5bd6c0ddf74ba6f8',
              });
              core.info('V6.2 current tree clean: ' + JSON.stringify(result));
            } else {
              throw new Error('unsupported event: ' + context.eventName);
            }
