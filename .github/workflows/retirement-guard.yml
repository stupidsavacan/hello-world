name: Retirement Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  retirement-policy:
    if: github.event_name == 'pull_request_target'
    name: retirement-policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce current retirement policy from the base branch
        uses: actions/github-script@v7
        with:
          script: |
            const crypto = require('crypto');
            const posix = require('path').posix;
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const EXPECTED_POLICY_DIGEST = '994a0a34cc2cb292d6c94c8da64a77b70f0190feae8be02e4480d4b84a042b10';

            const response = await github.rest.repos.getContent({
              owner, repo, path: '.retirement/retired-paths.json', ref: pr.base.sha,
            });
            if (Array.isArray(response.data) || !response.data.content) {
              core.setFailed('Retirement registry is unavailable on the base branch.');
              return;
            }
            const registry = JSON.parse(Buffer.from(response.data.content, 'base64').toString('utf8'));
            const critical = {
              guardPaths: [...(registry.guardPaths || [])].sort(),
              requiredCheckContext: registry.requiredCheckContext || '',
              retiredContractMarkers: [...(registry.retiredContractMarkers || [])].sort(),
              retiredModuleRoots: [...(registry.retiredModuleRoots || [])].sort(),
              retiredPaths: [...(registry.retiredPaths || [])].sort(),
            };
            const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
            if (registry.policyDigest !== EXPECTED_POLICY_DIGEST || actualDigest !== EXPECTED_POLICY_DIGEST) {
              core.setFailed(`Base retirement policy drifted. expected=${EXPECTED_POLICY_DIGEST} declared=${registry.policyDigest || 'missing'} actual=${actualDigest}`);
              return;
            }

            function canonical(input) {
              let value = posix.normalize(String(input || '')).replace(/^\.\//, '');
              value = value.replace(/\.(?:[cm]?[jt]sx?|css|json)$/i, '');
              value = value.replace(/\/index$/i, '');
              return value;
            }
            const retiredPaths = new Set(registry.retiredPaths || []);
            const retiredRoots = (registry.retiredModuleRoots || []).map(canonical);
            const retiredMarkers = registry.retiredContractMarkers || [];
            const guardPaths = new Set(registry.guardPaths || []);
            const matchesRoot = (input) => {
              const candidate = canonical(input);
              return retiredRoots.some((root) => candidate === root || candidate.startsWith(`${root}/`));
            };
            const resolveSpecifier = (filename, specifier) => {
              if (!specifier) return null;
              if (specifier.startsWith('.')) return canonical(posix.join(posix.dirname(filename), specifier));
              if (specifier.startsWith('/')) return canonical(specifier.slice(1));
              if (specifier.startsWith('loopdeck/') || specifier.startsWith('mahjong/')) return canonical(specifier);
              return null;
            };
            const collectSpecifiers = (source) => {
              const found = new Set();
              const patterns = [
                /\b(?:import|export)\s+(?:[^'\"]*?\s+from\s*)?['\"]([^'\"]+)['\"]/g,
                /\brequire\s*\(\s*['\"]([^'\"]+)['\"]\s*\)/g,
                /\brequire\.resolve\s*\(\s*['\"]([^'\"]+)['\"]\s*\)/g,
                /\bimport\s*\(\s*['\"]([^'\"]+)['\"]\s*\)/g,
              ];
              for (const pattern of patterns) for (const match of source.matchAll(pattern)) found.add(match[1]);
              return [...found];
            };

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const liveFiles = files.filter((file) => file.status !== 'removed');
            const violations = [];
            for (const file of liveFiles) {
              if (retiredPaths.has(file.filename) || matchesRoot(file.filename)) violations.push(file.filename);
              if (!/\.(?:[cm]?[jt]sx?)$/i.test(file.filename) || !file.sha) continue;
              let source = '';
              try {
                const blob = await github.rest.git.getBlob({ owner, repo, file_sha: file.sha });
                source = blob.data.encoding === 'base64'
                  ? Buffer.from(blob.data.content, 'base64').toString('utf8')
                  : String(blob.data.content || '');
              } catch (error) {
                core.warning(`Could not inspect ${file.filename}: ${error.message}`);
                continue;
              }
              for (const specifier of collectSpecifiers(source)) {
                const resolved = resolveSpecifier(file.filename, specifier);
                if (resolved && matchesRoot(resolved)) violations.push(`${file.filename} -> ${specifier}`);
              }
              for (const marker of retiredMarkers) if (source.includes(marker)) violations.push(`${file.filename} -> ${marker}`);
            }
            const guardChanges = files.filter((file) => guardPaths.has(file.filename));
            if (guardChanges.length) violations.push(...guardChanges.map((file) => `guard:${file.filename}`));
            const unique = [...new Set(violations)];
            if (unique.length) {
              core.error(`Retirement policy violations: ${unique.join(' | ')}`);
              core.setFailed('Retirement contract violated.');
              return;
            }
            core.info('Retirement contract clean and active-product policy digest intact.');

  current-tree:
    if: github.event_name == 'push'
    name: current-tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify policy digest and retired aliases
        run: |
          node <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const cp = require('child_process');
          const posix = require('path').posix;
          const EXPECTED_POLICY_DIGEST = '994a0a34cc2cb292d6c94c8da64a77b70f0190feae8be02e4480d4b84a042b10';
          const registry = JSON.parse(fs.readFileSync('.retirement/retired-paths.json', 'utf8'));
          const critical = {
            guardPaths: [...(registry.guardPaths || [])].sort(),
            requiredCheckContext: registry.requiredCheckContext || '',
            retiredContractMarkers: [...(registry.retiredContractMarkers || [])].sort(),
            retiredModuleRoots: [...(registry.retiredModuleRoots || [])].sort(),
            retiredPaths: [...(registry.retiredPaths || [])].sort(),
          };
          const actualDigest = crypto.createHash('sha256').update(JSON.stringify(critical)).digest('hex');
          if (registry.policyDigest !== EXPECTED_POLICY_DIGEST || actualDigest !== EXPECTED_POLICY_DIGEST) {
            console.error(`Retirement policy drift: expected=${EXPECTED_POLICY_DIGEST} declared=${registry.policyDigest || 'missing'} actual=${actualDigest}`);
            process.exit(1);
          }
          const files = cp.execSync('git ls-files -z').toString('utf8').split('\0').filter(Boolean);
          const fileSet = new Set(files);
          function canonical(input) {
            let value = posix.normalize(String(input || '')).replace(/^\.\//, '');
            value = value.replace(/\.(?:[cm]?[jt]sx?|css|json)$/i, '');
            value = value.replace(/\/index$/i, '');
            return value;
          }
          const retiredPaths = new Set(registry.retiredPaths || []);
          const roots = (registry.retiredModuleRoots || []).map(canonical);
          const matchesRoot = (input) => {
            const candidate = canonical(input);
            return roots.some((root) => candidate === root || candidate.startsWith(`${root}/`));
          };
          const violations = files.filter((file) => retiredPaths.has(file) || matchesRoot(file));
          const missingGuards = (registry.guardPaths || []).filter((file) => !fileSet.has(file));
          if (violations.length || missingGuards.length) {
            if (violations.length) console.error('Retired path/module aliases on main:', [...new Set(violations)].join(', '));
            if (missingGuards.length) console.error('Missing guard paths:', missingGuards.join(', '));
            process.exit(1);
          }
          console.log('Active-product retirement policy digest and current tree are consistent.');
          NODE
      - name: Run LoopDeck sentry
        working-directory: loopdeck
        run: node tests/retirementSentry.test.mjs
      - name: Run Mahjong sentry
        run: node mahjong/tests/retirement-sentry.test.js
