name: Mahjong Snapshot CI

on:
  push:
    branches:
      - agent/mahjong-canonical-modern-snapshot-0315

permissions:
  contents: read

jobs:
  playable-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine and replay E2E
        run: node mahjong/snapshot-tests/engine-e2e.test.js
      - name: Replay hardening
        run: node mahjong/snapshot-tests/replay-hardening.test.js
      - name: Browser bootstrap smoke
        run: node mahjong/snapshot-tests/browser-smoke.test.js
      - name: Product regressions
        run: |
          set -euo pipefail
          tests=(
            mahjong/tests/tile-face-bootstrap.test.js
            mahjong/tests/replay-viewer-core.test.js
            mahjong/tests/replay-panel-bootstrap.test.js
            mahjong/tests/settings-export-import-core.test.js
            mahjong/tests/settings-transfer-bootstrap.test.js
            mahjong/tests/record-index-filter.test.js
            mahjong/tests/records-dashboard-bootstrap.test.js
            mahjong/tests/action-calls-core.test.js
            mahjong/tests/advanced-rules-core.test.js
            mahjong/tests/cpu-assist-core.test.js
            mahjong/tests/hand-analysis.test.js
            mahjong/tests/integrity-recovery.test.js
            mahjong/tests/match-core.test.js
            mahjong/tests/records-storage-core.test.js
            mahjong/tests/scoring-core.test.js
            mahjong/tests/yaku-analysis.test.js
          )
          for test_file in "${tests[@]}"; do
            echo "::group::$test_file"
            node "$test_file"
            echo "::endgroup::"
          done
