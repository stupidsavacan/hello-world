name: Retirement Guard v4 One-Time Bootstrap

on:
  workflow_run:
    workflows: ["Retirement Guard"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  authorize-exact-v4-policy-commit:
    if: >-
      github.event.workflow_run.event == 'pull_request_target' &&
      github.event.workflow_run.head_branch == 'guard/retirement-policy-v4-after-extinction' &&
      github.event.workflow_run.head_sha == 'a91233977296cf26cdbbfe0e13ce460dd374211c' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Publish one-time bootstrap authorization
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const allowedPr = 177;
            const allowedHead = 'a91233977296cf26cdbbfe0e13ce460dd374211c';
            const allowedBranch = 'guard/retirement-policy-v4-after-extinction';
            const run = context.payload.workflow_run;

            if (run.head_sha !== allowedHead || run.head_branch !== allowedBranch) {
              core.setFailed('Bootstrap ticket does not match the approved immutable head.');
              return;
            }

            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: allowedPr });
            if (
              pr.state !== 'open' ||
              pr.base.ref !== 'main' ||
              pr.head.ref !== allowedBranch ||
              pr.head.sha !== allowedHead
            ) {
              core.setFailed('PR #177 no longer matches the one-time bootstrap authorization.');
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: allowedPr,
              per_page: 100,
            });
            const expected = new Set([
              '.retirement/retired-paths.json',
              '.github/workflows/retirement-guard.yml',
              'loopdeck/tests/retirementSentry.test.mjs',
              'mahjong/tests/retirement-sentry.test.js',
            ]);
            const actual = new Set(files.map((file) => file.filename));
            const unexpected = [...actual].filter((path) => !expected.has(path));
            const missing = [...expected].filter((path) => !actual.has(path));
            if (unexpected.length || missing.length || actual.size !== expected.size) {
              core.setFailed(`Bootstrap PR file set changed. unexpected=${unexpected.join(',')} missing=${missing.join(',')}`);
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: allowedHead,
              state: 'success',
              context: 'Retirement Guard / retirement-policy',
              description: 'One-time Guard v4 policy bootstrap authorized'
            });

            core.notice('Authorized exactly PR #177 at immutable head a91233977296cf26cdbbfe0e13ce460dd374211c.');
