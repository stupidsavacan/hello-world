<dialog id="replayDialog"><div class="dialog-card wide"><header><h2>牌譜リプレイ</h2><button id="closeReplayButton">×</button></header><div class="replay-picker"><label>牌譜 <select id="replayRecordSelect"></select></label></div><div id="replayRoot"></div></div></dialog>
<dialog id="debugDialog"><div class="dialog-card wide"><header><h2>デバッグ</h2><button data-close="debugDialog">×</button></header><label>固定 seed <input id="seedInput" maxlength="128"></label><div class="row"><button id="applySeedButton">seedで新しい対局</button><button id="resetStorageButton" class="danger">保存データを全削除</button></div><pre id="debugRoot"></pre></div></dialog>

  const js = jsGitObjects.map((git, index) => ({
    name: `js-${String(index + 1).padStart(2, "0")}.asset`,
    git
  }));

  function readBytes(path) {
    return fetch(path, { cache: "no-store" }).then((response) => {
      if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
      return response.arrayBuffer();
    }).then((buffer) => new Uint8Array(buffer)).catch((fetchError) => new Promise((resolve, reject) => {
      try {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", path, true);
        xhr.responseType = "arraybuffer";
        xhr.onload = () => {
          if ((xhr.status >= 200 && xhr.status < 300) || (location.protocol === "file:" && xhr.status === 0)) {
            resolve(new Uint8Array(xhr.response));
          } else {
            reject(fetchError);
          }
        };
        xhr.onerror = () => reject(fetchError);
        xhr.send();
      } catch (_) {
        reject(fetchError);
      }
    }));
  }

  function hex(bytes) {
    return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
  }

  async function assertGitObject(item, bytes) {
    const subtle = globalThis.crypto && globalThis.crypto.subtle;
    if (!subtle) {
      console.warn(`Git object integrity check unavailable for ${item.name}`);
      return;
    }
    const encoder = new TextEncoder();
    const header = encoder.encode(`blob ${bytes.byteLength}\0`);
    const input = new Uint8Array(header.byteLength + bytes.byteLength);
    input.set(header, 0);
    input.set(bytes, header.byteLength);
    let digest;
    try {
      digest = await subtle.digest("SHA-1", input);
    } catch (error) {
      if (error && error.name === "NotSupportedError") {
        console.warn(`SHA-1 integrity check unavailable for ${item.name}`);
        return;
      }
      throw error;
    }
    const actual = hex(new Uint8Array(digest));
    if (actual !== item.git) {
      throw new Error(`${item.name}: Git object mismatch (expected ${item.git}, got ${actual})`);
    }
  }

  async function verifiedText(item) {
    const bytes = await readBytes(base + item.name);
    await assertGitObject(item, bytes);
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }

  async function start() {
    for (const item of css) {
      const style = document.createElement("style");
      style.dataset.packagedFrom = item.name;
      style.textContent = await verifiedText(item);
      document.head.appendChild(style);
    }
    for (const item of js) {
      const source = await verifiedText(item);
      (0, eval)(`${source}\n//# sourceURL=${base + item.name}`);
    }
  }

  start().catch((error) => {
    console.error("Packaged Mahjong startup failed", error);
    const status = document.getElementById("statusLine");
    if (status) status.textContent = `起動失敗: ${error && error.message ? error.message : String(error)}`;
  });
})();
