<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>オフライン三麻</title>
<link rel="stylesheet" href="src/styles/app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar"><div><h1>オフライン三麻</h1><p id="statusLine">起動中…</p></div><nav><button id="newGameButton">新しい対局</button><button id="settingsButton">設定</button><button id="recordsButton">牌譜・成績</button><button id="debugButton">デバッグ</button></nav></header>
<main><section id="tableRoot" class="table" aria-label="麻雀卓"></section><section id="actionRoot" class="actions" aria-live="polite"></section><section id="logRoot" class="logs"></section></main>
</div>
<dialog id="settingsDialog"><div class="dialog-card"><header><h2>ルール設定</h2><button data-close="settingsDialog">×</button></header><div id="settingsRoot" class="settings-grid"></div><footer><button id="saveSettingsButton">保存して新しい対局</button></footer></div></dialog>
<dialog id="recordsDialog"><div class="dialog-card wide"><header><h2>牌譜・履歴・成績</h2><button data-close="recordsDialog">×</button></header><div id="recordsRoot"></div></div></dialog>
<dialog id="debugDialog"><div class="dialog-card wide"><header><h2>デバッグ</h2><button data-close="debugDialog">×</button></header><label>固定 seed <input id="seedInput" maxlength="128"></label><div class="row"><button id="applySeedButton">seedで新しい対局</button><button id="resetStorageButton" class="danger">保存データを全削除</button></div><pre id="debugRoot"></pre></div></dialog>
<script src="src/game/RuleConfig.js"></script><script src="src/debug/DebugEventLog.js"></script><script src="src/game/GameStateMachine.js"></script><script src="src/game/RoundManager.js"></script><script src="src/game/HonbaManager.js"></script><script src="src/game/RankingManager.js"></script><script src="src/game/EndConditionManager.js"></script><script src="src/game/MatchManager.js"></script><script src="src/game/Tile.js"></script><script src="src/game/HandAnalysis.js"></script><script src="src/game/DoraCalculator.js"></script><script src="src/game/YakuAnalysis.js"></script><script src="src/game/ScoreCalculator.js"></script><script src="src/game/Settlement.js"></script><script src="src/game/RiichiManager.js"></script><script src="src/game/KanManager.js"></script><script src="src/game/KitaManager.js"></script><script src="src/game/FuritenManager.js"></script><script src="src/game/RiichiRules.js"></script><script src="src/game/KanRules.js"></script><script src="src/game/EndTurnYakuResolver.js"></script><script src="src/game/SanmaRuleDetails.js"></script><script src="src/game/ActionResolver.js"></script><script src="src/game/CpuVisibleTiles.js"></script><script src="src/game/CpuRiskAnalysis.js"></script><script src="src/game/CpuStrategy.js"></script><script src="src/game/CallResolver.js"></script><script src="src/game/AssistManager.js"></script><script src="src/game/GameRecord.js"></script><script src="src/game/CallWindow.js"></script><script src="src/game/SeedPolicy.js"></script><script src="src/game/Wall.js"></script><script src="src/game/Player.js"></script><script src="src/game/TileLedger.js"></script><script src="src/game/InvariantChecker.js"></script><script src="src/game/RecoveryManager.js"></script><script src="src/game/DrawContext.js"></script><script src="src/game/RecordFlow.js"></script><script src="src/game/RoundLifecycle.js"></script><script src="src/game/TurnFlow.js"></script><script src="src/game/TurnFlowCpu.js"></script><script src="src/game/WinFlow.js"></script><script src="src/game/CallFlow.js"></script><script src="src/game/KanFlow.js"></script><script src="src/game/RecoveryFlow.js"></script><script src="src/game/UiStateView.js"></script><script src="src/game/GameEngine.js"></script><script src="src/storage/SaveMigration.js"></script><script src="src/storage/RecordIndex.js"></script><script src="src/storage/settingsStorage.js"></script><script src="src/storage/gameRecordStorage.js"></script><script src="src/stats/AdvancedStats.js"></script><script src="src/main.js"></script>
